# ENG pixi P0a pilot: fastp env locked with pixi (mirror of envs/fastp).
# Source of truth: docs/manifests/envs/fastp.txt (@EXPLICIT, 9 packages).
# Toolchain libs pinned to the exact explicit builds for 9/9 parity.
[project]
name = "fastp"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
fastp = "==0.22.0"
libgomp = "==15.2.0"
libgcc = "==15.2.0"
libgcc-ng = "==15.2.0"
libstdcxx = "==15.2.0"
libstdcxx-ng = "==15.2.0"
libzlib = "==1.2.13"
zlib = "==1.2.13"
