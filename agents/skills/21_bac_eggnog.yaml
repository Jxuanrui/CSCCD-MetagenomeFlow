benchmarks:
  peak_memory_gb: 32
  typical_runtime_min: 120
conda_env: envs/eggnog
db_path: db/eggnog
depends_on:
- 18_bac_cdhit
dimension: bacteria
id: 21_bac_eggnog
inputs:
- description: Non-redundant protein sequences from CD-HIT (step 18)
  name: protein_nr
  path_pattern: '{workdir}/result/assembly/cdhit/protein_nr.fa'
  required: true
integration_status: integrated
known_issues:
- description: --dbmem loads eggNOG SQLite into RAM (32GB), significantly speeds up
    annotation step
  workaround: Add --dbmem to emapper.py call if memory allows
- description: Two-step workflow (--no_annot first, then --no_search) useful for HPC
    cluster
  workaround: Current script runs single-step; modify for HPC if needed
name: eggNOG-mapper v2 Comprehensive Annotation
outputs:
- description: Main annotation table (COG/KO/GO/EC/CAZy per gene)
  name: annotations
  path_pattern: '{workdir}/result/annotation/eggnog/eggnog.emapper.annotations'
- description: OG ortholog hits from DIAMOND search
  name: seed_orthologs
  path_pattern: '{workdir}/result/annotation/eggnog/eggnog.emapper.seed_orthologs'
parameters:
  input_type: proteins
  method: diamond
rule_type: aggregate
snakemake_rule: pipeline/rules/bacteria_annotation.smk::eggnog
