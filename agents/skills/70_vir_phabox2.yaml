id: "70_vir_phabox2"
script: "scripts/70_vir_phabox2.sh"
tool: "PhaBox2"
tool_version: "2.1.12"
conda_env: "envs/phabox2"
description: "End-to-end viral analysis and taxonomy prediction for vOTU contigs with PhaBox2."
dimension: "virome"
category: "taxonomy"
rule_type: "aggregate"

inputs:
  - name: "votu_fasta"
    path_pattern: "{workdir}/result/virus/votu/contigs/virus.fasta"
    required: true

outputs:
  - name: "phabox2_summary"
    path_pattern: "{workdir}/result/virus/phabox2/phabox2_summary.tsv"
    description: "PhaBox2 summary classification table."
  - name: "predict_dir"
    path_pattern: "{workdir}/result/virus/phabox2/predict/"
    description: "Raw PhaBox2 prediction output directory."

depends_on:
  - "56_vir_votu_gen"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

known_issues:
  - "PhaBox2 database must be pre-downloaded to {repo}/db/phabox2_db."

integration_status: "integrated"
integrated_date: "2026-06-16"
snakemake_rule: "virome.smk::phabox2"
