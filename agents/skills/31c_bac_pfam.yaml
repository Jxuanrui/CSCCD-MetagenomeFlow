id: "31c_bac_pfam"
script: "scripts/31c_bac_pfam.sh"
tool: "HMMER hmmscan"
tool_version: "3.x"
conda_env: "envs/dbcan"
description: "Aggregate Pfam-A protein domain annotation using parallel HMMER searches."
dimension: "bacteria"
category: "annotation"
rule_type: "aggregate"

inputs:
  - name: "protein_nr"
    path_pattern: "{workdir}/result/assembly/cdhit/protein_nr.fa"
    required: true
    description: "Non-redundant protein sequences from CD-HIT (step 18)."

outputs:
  - name: "tblout"
    path_pattern: "{workdir}/result/annotation/pfam/pfam_hits.tblout"
    description: "Gene-level Pfam-A HMMER table output."
  - name: "domtblout"
    path_pattern: "{workdir}/result/annotation/pfam/pfam_hits.domtblout"
    description: "Domain-level Pfam-A HMMER table output with coordinates."

depends_on:
  - "18_bac_cdhit"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

integration_status: "integrated"
integrated_date: "2026-07-16"
snakemake_rule: "pipeline/rules/bacteria_annotation.smk::bac_pfam"
