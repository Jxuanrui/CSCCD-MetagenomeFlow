id: "71_vir_dram"
script: "scripts/71_vir_dram.sh"
tool: "DRAM-v"
tool_version: "1.5.0"
conda_env: "envs/dram"
description: "Viral functional annotation and AMG summarization with DRAM-v."
dimension: "virome"
category: "annotation"
rule_type: "aggregate"

inputs:
  - name: "votu_fasta"
    path_pattern: "{workdir}/result/virus/votu/contigs/virus.fasta"
    required: true

outputs:
  - name: "dram_annotations"
    path_pattern: "{workdir}/result/virus/dram/DRAM_annotations.tsv"
    description: "Merged DRAM-v annotation table."
  - name: "dram_amg_summary"
    path_pattern: "{workdir}/result/virus/dram/DRAM_amg_summary.tsv"
    description: "AMG distillation summary table."

depends_on:
  - "56_vir_votu_gen"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

known_issues:
  - "Primary script logic expects vMAG FASTA inputs under {workdir}/result/virus/vmag/; current Snakemake integration uses the vOTU FASTA fallback."

integration_status: "integrated"
integrated_date: "2026-06-16"
snakemake_rule: "virome.smk::dram_v"
