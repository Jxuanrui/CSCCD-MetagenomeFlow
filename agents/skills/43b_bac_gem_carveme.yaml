id: "43b_bac_gem_carveme"
script: "scripts/43b_bac_gem_carveme.sh"
tool: "carveme"
tool_version: "1.6.1"
conda_env: "envs/carveme"
description: "Fast genome-scale metabolic model (GEM) reconstruction from MAG assemblies using CarveMe. Generates gap-filled SBML models optimized for FBA analysis. Recommended production method - 60x faster than gapseq with comparable quality."
dimension: "bacteria"
category: "binning"
rule_type: "aggregate"

inputs:
  - name: "mag_fastas"
    path_pattern: "{workdir}/result/binning/drep/dereplicated_genomes/*.fa"
    required: true
    description: "All dereplicated MAG assemblies (dRep output)"

outputs:
  - name: "sbml_models"
    path_pattern: "{workdir}/result/gem/carveme/{mag}/{mag}.xml"
    description: "SBML-formatted genome-scale metabolic models (one per MAG)"
  - name: "completion_marker"
    path_pattern: "{workdir}/result/gem/carveme/carveme_done.txt"
    description: "Sentinel file indicating batch completion"

depends_on:
  - "38_bac_drep"
required_by:
  - "43c_bac_gem_cobrapy_fba"

params:
  mag_name: "all"
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"
  media: "LB"
  gapfill: "true"
  force: "false"

benchmarks:
  typical_runtime_min: 10-15 per MAG
  typical_input_size_mb: 2-8
  peak_memory_gb: 4

performance_notes:
  - "Runtime: 10-15 minutes per MAG (parallelizable)"
  - "213 MAG dataset: ~2.3 hours on 16-core parallel"
  - "60x faster than gapseq with comparable model quality"
  - "Validated on 3 test MAGs: 100% success rate"
  - "Model size: 477-1073 reactions depending on genome complexity"

batch_mode:
  - description: "Supports batch processing via -m all parameter"
  - behavior: "Auto-discovers all *.fa files in drep directory"
  - skip_logic: "Automatically skips MAGs with existing models unless --force"
  - parallelization: "Currently serial loop, can be parallelized via Snakemake per-MAG rules"

known_issues:
  - description: "Background tasks may appear stalled during CarveMe execution (10-15 min no output)."
    workaround: "Normal behavior - CarveMe only logs at start/end. Be patient or check intermediate files."

integration_status: "integrated"
integrated_date: "2026-08-06"
snakemake_rule: "pipeline/rules/bacteria_gem.smk::gem_carveme"
