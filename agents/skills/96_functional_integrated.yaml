id: "96_functional_integrated"
script: "scripts/96_functional_integrated.sh"
tool: "Rscript"
tool_version: "companion script scripts/96_functional_integrated.R"
conda_env: "envs/r_stat"
description: "Integrated multi-database functional summary/visualization for a given dimension (bacteria/fungi/virus), consuming 96_stat_functional's per-func_type outputs."
dimension: "statistics"
category: "functional_differential"
rule_type: "aggregate"

inputs:
  - name: "functional_done_sentinels"
    path_pattern: "{workdir}/result/stat/{dimension}/functional/{func_type}/{dimension}_functional_{func_type}_done.txt"
    required: true

outputs:
  - name: "summary_done_sentinels"
    path_pattern: "{workdir}/result/stat/{dimension}/functional/00_summary/{dimension}_summary_done.txt"
    description: "One sentinel per dimension (bacteria/fungi/virus)."

depends_on:
  - "96_stat_functional"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"
  metadata: "{workdir}/metadata.csv"
  group: "group"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

integration_status: "integrated"
integrated_date: "2026-07-16"
snakemake_rule: "pipeline/rules/statistics.smk::stat_functional_integrated"

known_issues:
  - description: "Prior to 2026-07-16 this script's input path pointed at an intermediate 96_stat_functional output path that did not match what the renamed/verified 96_stat_functional.sh actually produces."
    workaround: "Path corrected during the 2026-07-16 Phase 2 integration pass; verified via a full Snakemake dry-run DAG build."
