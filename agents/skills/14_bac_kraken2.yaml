id: "14_bac_kraken2"
script: "scripts/14_bac_kraken2.sh"
tool: "kraken2+bracken"
tool_version: "2.1.3+2.x"
conda_env: "envs/kraken2"
description: "Kraken2 k-mer based taxonomic classification + Bracken abundance reestimation at species/genus/phylum level."
dimension: "bacteria"
category: "taxonomy"
rule_type: "per_sample"

inputs:
  - name: "r1"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_1.kneaddata.fastq.gz"
    required: true
  - name: "r2"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_2.kneaddata.fastq.gz"
    required: true

outputs:
  - name: "report"
    path_pattern: "{workdir}/result/kraken2/{sample}/{sample}.report"
    description: "Kraken2 standard report; input for Bracken and Krona visualization."
  - name: "output_gz"
    path_pattern: "{workdir}/result/kraken2/{sample}/{sample}.output.gz"
    description: "Per-read classification result (compressed)."
  - name: "bracken_species"
    path_pattern: "{workdir}/result/kraken2/{sample}/bracken/{sample}_S.bracken"
    description: "Species-level Bracken abundance table (main result)."
  - name: "bracken_genus"
    path_pattern: "{workdir}/result/kraken2/{sample}/bracken/{sample}_G.bracken"
    description: "Genus-level Bracken abundance table."
  - name: "bracken_phylum"
    path_pattern: "{workdir}/result/kraken2/{sample}/bracken/{sample}_P.bracken"
    description: "Phylum-level Bracken abundance table."

depends_on:
  - "02_qc_kneaddata"
required_by:
  - "14b_bac_kraken2_merge"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"
  confidence: "0.1"
  read_len: "150"

benchmarks:
  typical_runtime_min: ~
  typical_input_size_gb: ~
  peak_memory_gb: ~

known_issues:
  - description: "Bracken requires pre-built database index for the specific read length (default 150 bp). If using PE100 or PE250 data, run bracken-build first."
    workaround: "conda run --prefix envs/kraken2 bracken-build -d db/kraken2/pluspf -t 16 -l 100"
  - description: "Large .output file (~same size as input fastq). Script pipes to gzip to avoid disk pressure."
    workaround: "Output is saved as .output.gz; delete if disk is tight after analysis."

integration_status: "integrated"
integrated_date: "2026-06-06"
snakemake_rule: "pipeline/rules/bacteria_taxonomy.smk::kraken2"
