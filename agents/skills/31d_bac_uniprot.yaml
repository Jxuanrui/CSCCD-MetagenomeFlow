id: "31d_bac_uniprot"
script: "scripts/31d_bac_uniprot.sh"
tool: "MMseqs2 easy-search"
tool_version: "13.x"
conda_env: "envs/assembly"
description: "Aggregate high-confidence protein annotation against UniProt Swiss-Prot."
dimension: "bacteria"
category: "annotation"
rule_type: "aggregate"

inputs:
  - name: "protein_nr"
    path_pattern: "{workdir}/result/assembly/cdhit/protein_nr.fa"
    required: true
    description: "Non-redundant protein sequences from CD-HIT (step 18)."

outputs:
  - name: "hits"
    path_pattern: "{workdir}/result/annotation/uniprot_sprot/sprot_hits.tsv"
    description: "MMseqs2 best hits against the reviewed UniProt Swiss-Prot database."

depends_on:
  - "18_bac_cdhit"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

integration_status: "integrated"
integrated_date: "2026-07-16"
snakemake_rule: "pipeline/rules/bacteria_annotation.smk::bac_uniprot"
