id: "11_bac_metaphlan4"
script: "scripts/11_bac_metaphlan4.sh"
tool: "MetaPhlAn4"
tool_version: "4.2.4"
conda_env: "envs/humann4"
description: "Generate bacterial taxonomic profiles and archive SAM alignments for downstream strain analysis."
dimension: "bacteria"
category: "taxonomy"
rule_type: "per_sample"

inputs:
  - name: "kneaddata_r1"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_1.kneaddata.fastq.gz"
    required: true
  - name: "kneaddata_r2"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_2.kneaddata.fastq.gz"
    required: true

outputs:
  - name: "profile"
    path_pattern: "{workdir}/result/metaphlan4/{sample}/{sample}_profile.txt"
    description: "Per-sample MetaPhlAn4 abundance profile."
  - name: "sam_bz2"
    path_pattern: "{workdir}/result/metaphlan4/{sample}/{sample}.sam.bz2"
    description: "Compressed SAM alignments for StrainPhlAn4."

depends_on:
  - "02_qc_kneaddata"
required_by:
  - "11b_bac_metaphlan4_merge"
  - "12_bac_strainphlan4"
  - "13_bac_humann3"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  typical_input_size_gb: ~
  peak_memory_gb: ~

known_issues:
  - "The script concatenates paired reads into one merged FASTQ before running MetaPhlAn4 because the deployed v4.2.4 workflow does not use separate -1/-2 inputs here."

integration_status: "integrated"
integrated_date: "2026-06-06"
snakemake_rule: "metaphlan4"
