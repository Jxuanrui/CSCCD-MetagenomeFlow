id: "02_qc_kneaddata"
script: "scripts/02_qc_kneaddata.sh"
tool: "KneadData"
tool_version: "0.12.4"
conda_env: "envs/kneaddata"
description: "Remove host-derived reads from fastp-cleaned paired-end data using the human database."
dimension: "shared"
category: "qc"
rule_type: "per_sample"

inputs:
  - name: "clean_r1"
    path_pattern: "{workdir}/result/fastp/{sample}/{sample}_1.fastq.gz"
    required: true
  - name: "clean_r2"
    path_pattern: "{workdir}/result/fastp/{sample}/{sample}_2.fastq.gz"
    required: true

outputs:
  - name: "kneaddata_r1"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_1.kneaddata.fastq.gz"
    description: "Host-decontaminated read 1."
  - name: "kneaddata_r2"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_2.kneaddata.fastq.gz"
    description: "Host-decontaminated read 2."
  - name: "stats"
    path_pattern: "{workdir}/result/kneaddata/{sample}/stats.txt"
    description: "Extracted decontamination summary lines from the KneadData log."

depends_on:
  - "01_qc_fastp"
required_by:
  - "11_bac_metaphlan4"
  - "13_bac_humann3"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  typical_input_size_gb: ~
  peak_memory_gb: ~

known_issues:
  - "The script hardcodes the host reference database to {repo}/db/kneaddata/human and does not expose a host-selection parameter."

integration_status: "integrated"
integrated_date: "2026-06-06"
snakemake_rule: "kneaddata"
