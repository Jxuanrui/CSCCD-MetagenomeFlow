id: "51_vir_megahit"
script: "scripts/51_vir_megahit.sh"
tool: "MEGAHIT"
tool_version: "1.2.9"
conda_env: "envs/assembly"
description: "Viral assembly from clean reads (meta-large preset, min contig 1.5 kb)."
dimension: "virome"
category: "assembly"
rule_type: "per_sample"

inputs:
  - name: "kneaddata_r1"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_1.kneaddata.fastq.gz"
    required: true
  - name: "kneaddata_r2"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_2.kneaddata.fastq.gz"
    required: true

outputs:
  - name: "contigs"
    path_pattern: "{workdir}/result/virus/assembly/{sample}/{sample}.contigs.fa"
    description: "Assembled viral contigs (min 1.5 kb)."

depends_on:
  - "02_qc_kneaddata"
required_by:
  - "52_vir_genomad"
  - "53_vir_virsorter2"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

integration_status: "integrated"
integrated_date: "2026-06-07"
snakemake_rule: "virome.smk::vir_megahit"
