id: "51_vir_megahit"
script: "scripts/51_vir_megahit.sh"
tool: "MEGAHIT"
tool_version: "1.2.9"
status: "retained-not-in-pipeline (R-20261116-27)"
conda_env: "envs/assembly"
description: "[RETAINED-NOT-IN-PIPELINE since R-20261116-27: viral track now reuses bacterial contigs >=1500bp via 51a_vir_filter_contigs.sh. This independent megahit script is kept ONLY for the Phase-2 equivalence archive runs (n=1-3 samples, criteria: seq identity >=99% AND vOTU Jaccard >=0.95)."
dimension: "virome"
category: "assembly"
rule_type: "per_sample"

inputs:
  - name: "kneaddata_r1"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_1.kneaddata.fastq.gz"
    required: true
  - name: "kneaddata_r2"
    path_pattern: "{workdir}/result/kneaddata/{sample}/{sample}_2.kneaddata.fastq.gz"
    required: true

outputs:
  - name: "contigs"
    path_pattern: "{workdir}/result/virus/assembly/{sample}/{sample}.contigs.fa"
    description: "Assembled viral contigs (min 1.5 kb)."

depends_on:
  - "02_qc_kneaddata"
required_by:
  - "52_vir_genomad"
  - "53_vir_virsorter2"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

integration_status: "integrated"
integrated_date: "2026-06-07"
snakemake_rule: ""  # retained-not-in-pipeline: virome.smk has no vir_megahit rule (replaced by vir_genomad path)
