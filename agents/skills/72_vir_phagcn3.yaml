id: "72_vir_phagcn3"
script: "scripts/72_vir_phagcn3.sh"
tool: "PhaGCN3"
tool_version: "3.1"
conda_env: "envs/phagcn3"
description: "Bacteriophage taxonomy prediction for vOTU contigs with PhaGCN3."
dimension: "virome"
category: "taxonomy"
rule_type: "aggregate"

inputs:
  - name: "votu_fasta"
    path_pattern: "{workdir}/result/virus/votu/contigs/virus.fasta"
    required: true

outputs:
  - name: "phagcn3_prediction"
    path_pattern: "{workdir}/result/virus/phagcn3/phagcn3_prediction.tsv"
    description: "PhaGCN3 taxonomy prediction table."

depends_on:
  - "56_vir_votu_gen"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

known_issues: []

integration_status: "integrated"
integrated_date: "2026-06-16"
snakemake_rule: "virome.smk::phagcn3"
