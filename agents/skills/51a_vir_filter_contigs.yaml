id: "51a_vir_filter_contigs"
script: "scripts/51a_vir_filter_contigs.sh"
tool: "seqkit seq"
tool_version: "2.13.0 (conda env: assembly)"
conda_env: "envs/assembly"
description: "Viral-track input filter: bacterial megahit contigs >=1500bp (R-20261116-27 item 2; replaces independent vir_megahit — 54,980/54,990 contigs were identical)."
dimension: "virome"
category: "filter"
rule_type: "per_sample"

inputs:
  - name: "bac_contigs"
    path_pattern: "{workdir}/result/assembly/megahit/{sample}/{sample}.contigs.fa"
    required: true

outputs:
  - name: "contigs"
    path_pattern: "{workdir}/result/virus/assembly/{sample}/{sample}.contigs.fa"

notes: |
  Output path UNCHANGED from vir_megahit era so downstream (geNomad/VirSorter2/
  CheckV/provenance/validate_step) needs no edits. Contig naming follows the
  bacterial megahit namespace (declared in ASSEMBLY_STRATEGY v3). Atomic publish
  (.tmp -> mv). Cleanup registered via mgx_cleanup_register_file.
