id: "61_vir_vmag"
script: "scripts/61_vir_vmag.sh"
tool: "vRhyme"
tool_version: "1.1+"
conda_env: "envs/vrhyme"
description: "vMAG binning via vRhyme (multi-sample coverage + protein features)."
dimension: "virome"
category: "binning"
rule_type: "aggregate"

inputs:
  - name: "votu_fasta"
    path_pattern: "{workdir}/result/virus/votu/contigs/virus.fasta"
    required: true
  - name: "bam_files"
    path_pattern: "{workdir}/result/virus/votu/bam/{sample}.bam"
    required: true
    is_expand: true

outputs:
  - name: "vmag_done"
    path_pattern: "{workdir}/result/virus/vmag/bins/.done"
    description: "vMAG binning completion sentinel."
  - name: "vmag_bins"
    path_pattern: "{workdir}/result/virus/vmag/bins/vMAG/*.fasta"
    description: "vMAG bins (vRhyme output)."

depends_on:
  - "56_vir_votu_gen"
required_by:
  - "62_vir_checkv_mag"

params:
  threads: "{cpus}"
  workdir: "{workdir}"
  repo: "{repo}"

benchmarks:
  typical_runtime_min: ~
  peak_memory_gb: ~

known_issues:
  - "vRhyme requires BAM alignments to vOTU; ensure BAMs are available before launch."

integration_status: "integrated"
integrated_date: "2026-06-07"
snakemake_rule: "virome.smk::vir_vmag"
